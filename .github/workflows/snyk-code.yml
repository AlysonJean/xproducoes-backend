name: Snyk Code Scan

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
  push:
    branches: [ main, master ]

jobs:
  snyk-code:
    name: Snyk Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (backend, production)
        working-directory: ./
        run: |
          cd backend
          npm ci --omit=dev

      - name: Fail if 'inflight' is present in installed deps
        working-directory: ./backend
        run: |
          if npm ls inflight --all >/dev/null 2>&1; then
            echo "ERROR: 'inflight' found in installed dependencies. Aborting.">
            npm ls inflight --all || true
            exit 1
          else
            echo "OK: 'inflight' not found in installed dependencies."
          fi

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then echo "SNYK_TOKEN is not set"; exit 1; fi
          snyk auth $SNYK_TOKEN

      - name: Run Snyk Code (backend)
        working-directory: backend
        env:
          CI: true
        run: |
          # Static analysis (Snyk Code)
          snyk code test --severity-threshold=low

      - name: Upload Snyk results (optional)
        if: always()
        run: echo "Snyk scan finished"
