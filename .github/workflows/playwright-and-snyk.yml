name: CI — Playwright E2E & Snyk

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-backend:
    name: Backend tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        working-directory: backend
        run: |
          npm ci
      - name: Run backend tests
        working-directory: backend
        run: |
          npm test --silent

  playwright-e2e:
    name: Frontend Playwright E2E
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run build
          npx http-server -p 5173 -c-1 dist &
      - name: Run Playwright tests
        working-directory: frontend
        run: |
          npm run test:e2e --if-present

  snyk-scan:
    name: Snyk scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm i -g snyk
          snyk auth $SNYK_TOKEN
          snyk test || true
